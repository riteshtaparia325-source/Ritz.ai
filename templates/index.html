<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritz.ai | Smart text processing</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* === THEME VARIABLES === */
        :root {
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #000000 100%);
            --bg-panel: rgba(0, 0, 0, 0.55);
            --bg-input: rgba(255, 255, 255, 0.05);
            --bg-dropdown: #064e3b; 
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(16, 185, 129, 0.2);
            --user-bubble: #10b981;
            --ai-bubble: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(12px);
        }

        body.theme-light {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
            --bg-panel: #ffffff;
            --bg-input: #f8fafc;
            --bg-dropdown: #ffffff; 
            --primary: #059669;
            --primary-hover: #047857;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --user-bubble: #059669;
            --ai-bubble: #f1f5f9;
            --glass-blur: none;
        }

        /* === GLOBAL STYLES === */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .sidebar {
            width: 350px;
            box-sizing: border-box; 
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.4s ease;
            overflow-y: auto;
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }

        /* Sidebar Elements */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .brand span { color: var(--primary); }
        .tagline { color: var(--text-muted); font-size: 13px; margin-bottom: 30px; }

        .theme-toggle {
            background: none; border: 1px solid var(--border); color: var(--text-main);
            border-radius: 50%; width: 36px; height: 36px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s;
        }
        .theme-toggle:hover { background: var(--bg-input); }

        label { font-weight: 600; font-size: 14px; margin: 15px 0 8px; display: block; }
        
        textarea {
            width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-main); font-size: 14px; box-sizing: border-box;
            outline: none; transition: border 0.3s; height: 160px; resize: none; margin-bottom: 20px;
        }
        textarea:focus { border-color: var(--primary); }

        /* === CUSTOM ANIMATED DROPDOWN === */
        .custom-select-wrapper { position: relative; margin-bottom: 20px; user-select: none; width: 100%; }
        
        .custom-select {
            width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-main); font-size: 14px; cursor: pointer; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center; transition: border 0.3s;
        }
        .custom-select:hover { border-color: var(--primary); }
        .custom-select::after { content: '▼'; font-size: 10px; color: var(--primary); transition: transform 0.3s ease; }
        .custom-select.active::after { transform: rotate(180deg); }

        .custom-options {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0;
            background: var(--bg-dropdown); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 99;
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden;
        }
        .custom-select-wrapper.open .custom-options { opacity: 1; visibility: visible; transform: translateY(0); }
        .custom-option {
            padding: 12px 14px; cursor: pointer; transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-main);
        }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background: var(--primary); color: white; }

        /* Submit Button */
        button.action-btn {
            width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px;
            font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; box-sizing: border-box;
            transition: background 0.2s, transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        button.action-btn:hover { background-color: var(--primary-hover); }
        button.action-btn:active { transform: scale(0.98); }
        button.action-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Secondary Submit Button (Compare) */
        button.secondary-btn {
            background-color: transparent; border: 1px solid var(--primary); color: var(--primary);
        }
        button.secondary-btn:hover { background-color: rgba(16, 185, 129, 0.1); }

        /* Native Styled Selects for Comparators */
        select.styled-select {
            width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-main); font-size: 13px; margin-bottom: 10px;
            outline: none; appearance: none; cursor: pointer;
        }
        select.styled-select:focus { border-color: var(--primary); }

        /* Chat History Area */
        .chat-header { padding: 20px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); backdrop-filter: var(--glass-blur); }
        .clear-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; font-size: 13px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .clear-btn:hover { background: var(--border); color: var(--text-main); }
        .chat-feed { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

        /* Chat Bubbles */
        .message { max-width: 80%; padding: 18px 24px; border-radius: 12px; line-height: 1.6; font-size: 15px; position: relative; animation: fadeIn 0.3s ease; border: 1px solid var(--border); backdrop-filter: var(--glass-blur); }
        .user-msg { background: var(--user-bubble); color: white; align-self: flex-end; border-bottom-right-radius: 2px; border: none; }
        .ai-msg { background: var(--ai-bubble); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 2px; width: 100%; max-width: 85%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .msg-label { font-size: 12px; font-weight: bold; opacity: 0.7; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* High-contrast Pill Badge */
        .engine-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            padding: 5px 14px;
            border-radius: 20px; 
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }

        /* Comparator Inner Layout */
        .comparison-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
            width: 100%;
        }
        .compare-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        .compare-header {
            font-size: 13px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        /* Markdown Styling */
        .ai-msg h1, .ai-msg h2, .ai-msg h3 { margin-top: 0; color: var(--primary); }
        .ai-msg p { margin: 0 0 10px 0; }
        .ai-msg p:last-child { margin: 0; }
        .ai-msg pre { background: var(--bg-input); padding: 12px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border); }
        .ai-msg code { font-family: monospace; background: var(--bg-input); padding: 2px 5px; border-radius: 4px; font-size: 13px; color: var(--primary); }

        /* Copy Button */
        .copy-btn { position: absolute; top: 15px; right: 15px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s; z-index: 2; }
        .copy-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Submit Button Spinner */
        .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; display: none; }
        
        /* NEW: In-Chat Typing Indicator */
        .typing-indicator { display: flex; align-items: center; gap: 6px; padding: 5px 0; height: 24px; }
        .typing-dot { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        .empty-state { text-align: center; color: var(--text-muted); margin: auto; display: flex; flex-direction: column; align-items: center; }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 15px; opacity: 0.5; color: var(--primary); }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        @media (max-width: 768px) {
            .comparison-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header-row">
            <div class="brand">Ritz<span>.ai</span></div>
            <button class="theme-toggle" id="theme-btn" title="Toggle Light/Dark Mode">☀️</button>
        </div>
        <div class="tagline">Intelligent Context Processor</div>

        <form id="ai-form">
            <label>Select Engine (Optional)</label>
            
            <div class="custom-select-wrapper" id="dropdown-wrapper">
                <div class="custom-select" id="custom-select-box">Standard Assistant</div>
                <div class="custom-options">
                    <div class="custom-option" data-value="0">Standard Assistant</div>
                    <div class="custom-option" data-value="1">Explain Like I'm 5</div>
                    <div class="custom-option" data-value="2">Summarize Text</div>
                    <div class="custom-option" data-value="3">Generate Quiz Questions</div>
                    <div class="custom-option" data-value="4">Create a Study Plan</div>
                    <div class="custom-option" data-value="5">Generate Interview Questions</div>
                </div>
            </div>
            
            <input type="hidden" id="choice" name="choice" value="0">

            <label for="user_text">Message</label>
            <textarea id="user_text" name="user_text" placeholder="What's on your mind? Ask a question or paste source material here..."></textarea>

            <button type="submit" id="submit-btn" class="action-btn">
                <div class="spinner" id="btn-spinner"></div>
                <span id="btn-text">Generate Output</span>
            </button>
        </form>

        <div style="margin-top: 30px; padding-top: 25px; border-top: 1px solid var(--border);">
            <div style="font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px;">Advanced: Compare Models</div>
            
            <select id="compare-choice-1" class="styled-select">
                <option value="1">Explain Like I'm 5</option>
                <option value="2">Summarize Text</option>
                <option value="3">Generate Quiz Questions</option>
                <option value="4">Create a Study Plan</option>
                <option value="5">Generate Interview Questions</option>
            </select>

            <select id="compare-choice-2" class="styled-select">
                <option value="2" selected>Summarize Text</option>
                <option value="1">Explain Like I'm 5</option>
                <option value="3">Generate Quiz Questions</option>
                <option value="4">Create a Study Plan</option>
                <option value="5">Generate Interview Questions</option>
            </select>
            
            <button type="button" id="compare-btn" class="action-btn secondary-btn" onclick="runSideBySideComparison()">
                <div class="spinner" id="compare-spinner" style="border-top-color: var(--primary);"></div>
                <span id="compare-btn-text">Compare Engines</span>
            </button>
        </div>

    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div style="font-weight: 600;">Workspace</div>
            <button class="clear-btn" id="clear-btn">Clear History</button>
        </div>
        
        <div class="chat-feed" id="chat-feed">
            <div class="empty-state" id="empty-state">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <p>System ready. Select an engine and provide context to begin.</p>
            </div>
        </div>
    </div>

<script>
    const feed = document.getElementById('chat-feed');
    const emptyState = document.getElementById('empty-state');

    // --- CUSTOM DROPDOWN LOGIC ---
    const dropdownWrapper = document.getElementById('dropdown-wrapper');
    const selectBox = document.getElementById('custom-select-box');
    const options = document.querySelectorAll('.custom-option');
    const hiddenInput = document.getElementById('choice');

    selectBox.addEventListener('click', (e) => {
        dropdownWrapper.classList.toggle('open');
        selectBox.classList.toggle('active');
        e.stopPropagation(); 
    });

    options.forEach(option => {
        option.addEventListener('click', () => {
            selectBox.innerText = option.innerText;
            hiddenInput.value = option.getAttribute('data-value');
            dropdownWrapper.classList.remove('open');
            selectBox.classList.remove('active');
        });
    });

    document.addEventListener('click', (e) => {
        if (!dropdownWrapper.contains(e.target)) {
            dropdownWrapper.classList.remove('open');
            selectBox.classList.remove('active');
        }
    });

    // --- THEME TOGGLE LOGIC ---
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('theme-light');
        if(document.body.classList.contains('theme-light')) {
            themeBtn.innerText = '🌙'; 
        } else {
            themeBtn.innerText = '☀️'; 
        }
    });

    // --- FORM SUBMISSION LOGIC (STANDARD) ---
    document.getElementById('ai-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const userText = document.getElementById('user_text').value.trim();

        if (!userText) {
            alert("Please enter some source material first.");
            return;
        }

        if (emptyState) emptyState.style.display = 'none';

        const choiceVal = document.getElementById('choice').value;
        const featureName = selectBox.innerText;
        let formattedUserContent = '';

        if (choiceVal === "0") {
            formattedUserContent = `<div style="white-space: pre-wrap;">${userText}</div>`;
        } else {
            formattedUserContent = `
                <div class="engine-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 6px;">
                        <path d="M12 0C12 6.6 17.4 12 24 12C17.4 12 12 17.4 12 24C12 17.4 6.6 12 0 12C6.6 12 12 6.6 12 0Z"/>
                    </svg>
                    ${featureName}
                </div>
                <div style="white-space: pre-wrap;">${userText}</div>
            `;
        }
        
        appendMessage('user', formattedUserContent);
        appendMessage('loading', '');

        btnText.innerText = 'Processing...';
        btnSpinner.style.display = 'block';
        submitBtn.disabled = true;

        const formData = new FormData(this);

        try {
            const response = await fetch('/process', { method: 'POST', body: formData });
            const data = await response.json();

            const loadingBubble = document.getElementById('temp-loading-bubble');
            if (loadingBubble) loadingBubble.remove();

            if (data.error) {
                appendMessage('error', data.error);
            } else {
                const formattedHTML = marked.parse(data.result);
                appendMessage('ai', formattedHTML, data.result);
            }
        } catch (err) {
            const loadingBubble = document.getElementById('temp-loading-bubble');
            if (loadingBubble) loadingBubble.remove();
            appendMessage('error', "Connection to Ritz.ai server failed.");
        } finally {
            btnText.innerText = 'Generate Output';
            btnSpinner.style.display = 'none';
            submitBtn.disabled = false;
            document.getElementById('user_text').value = ''; 
        }
    });

    // --- ADDED: COMPARISON SUBMISSION LOGIC ---
    async function runSideBySideComparison() {
        const userText = document.getElementById('user_text').value.trim();
        const choice1 = document.getElementById('compare-choice-1').value;
        const choice2 = document.getElementById('compare-choice-2').value;
        
        const select1 = document.getElementById('compare-choice-1');
        const select2 = document.getElementById('compare-choice-2');
        const label1 = select1.options[select1.selectedIndex].text;
        const label2 = select2.options[select2.selectedIndex].text;

        if (!userText) {
            alert("Please enter some source material first.");
            return;
        }

        if (emptyState) emptyState.style.display = 'none';

        // Add User Bubble specific to comparison
        const formattedUserContent = `
            <div class="engine-badge" style="background: rgba(16, 185, 129, 0.2); border-color: var(--primary);">
                Comparing: ${label1} vs ${label2}
            </div>
            <div style="white-space: pre-wrap;">${userText}</div>
        `;
        appendMessage('user', formattedUserContent);
        appendMessage('loading', '');

        const compareBtn = document.getElementById('compare-btn');
        const btnText = document.getElementById('compare-btn-text');
        const btnSpinner = document.getElementById('compare-spinner');

        btnText.innerText = 'Comparing...';
        btnSpinner.style.display = 'block';
        compareBtn.disabled = true;

        try {
            const response = await fetch('/compare', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_text: userText,
                    choice1: choice1,
                    choice2: choice2
                })
            });

            const data = await response.json();

            const loadingBubble = document.getElementById('temp-loading-bubble');
            if (loadingBubble) loadingBubble.remove();

            if (data.error) {
                appendMessage('error', data.error);
            } else {
                const html1 = marked.parse(data.result1);
                const html2 = marked.parse(data.result2);
                
                // Construct Split-Screen HTML
                const splitContent = `
                    <div class="comparison-container">
                        <div class="compare-box">
                            <div class="compare-header">${label1}</div>
                            <div class="markdown-body" style="font-size: 0.95em;">${html1}</div>
                        </div>
                        <div class="compare-box">
                            <div class="compare-header">${label2}</div>
                            <div class="markdown-body" style="font-size: 0.95em;">${html2}</div>
                        </div>
                    </div>
                `;
                
                // Allow user to copy both results at once
                const combinedRawText = `--- ${label1} ---\n${data.result1}\n\n--- ${label2} ---\n${data.result2}`;
                
                appendMessage('ai', splitContent, combinedRawText);
            }
        } catch (err) {
            const loadingBubble = document.getElementById('temp-loading-bubble');
            if (loadingBubble) loadingBubble.remove();
            appendMessage('error', "Connection to Ritz.ai server failed.");
        } finally {
            btnText.innerText = 'Compare Engines';
            btnSpinner.style.display = 'none';
            compareBtn.disabled = false;
            document.getElementById('user_text').value = ''; 
        }
    }

    // --- MESSAGE RENDERING LOGIC ---
    function appendMessage(sender, content, rawText = "") {
        const div = document.createElement('div');
        div.classList.add('message');
        
        if (sender === 'user') {
            div.classList.add('user-msg');
            div.innerHTML = `<div class="msg-label">You</div>${content}`;
        } else if (sender === 'loading') {
            div.classList.add('ai-msg');
            div.id = 'temp-loading-bubble'; 
            div.innerHTML = `
                <div class="msg-label">Ritz.ai</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
        } else if (sender === 'ai') {
            div.classList.add('ai-msg');
            div.innerHTML = `
                <div class="msg-label">Ritz.ai</div>
                <button class="copy-btn" onclick="copyToClipboard(this)">Copy Text</button>
                <div class="markdown-body">${content}</div>
            `;
            // Escape special characters so the attribute works perfectly
            const safeRawText = rawText.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            div.setAttribute('data-raw', safeRawText);
        } else {
            div.classList.add('ai-msg');
            div.style.borderLeft = "4px solid #ef4444";
            div.innerHTML = `<div class="msg-label" style="color:#ef4444;">Error</div>${content}`;
        }

        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
    }

    // --- CLEAR HISTORY & COPY LOGIC ---
    document.getElementById('clear-btn').addEventListener('click', () => {
        feed.innerHTML = '';
        feed.appendChild(emptyState);
        emptyState.style.display = 'flex';
    });

    window.copyToClipboard = function(btnElement) {
        const parentDiv = btnElement.parentElement;
        
        // Decode the text before copying it to clipboard
        const rawText = parentDiv.getAttribute('data-raw');
        const txt = document.createElement("textarea");
        txt.innerHTML = rawText;
        const textToCopy = txt.value;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btnElement.innerText;
            btnElement.innerText = "Copied!";
            btnElement.style.background = "var(--primary)";
            btnElement.style.color = "white";
            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.background = "var(--bg-input)";
                btnElement.style.color = "var(--text-main)";
            }, 2000);
        });
    }
</script>

</body>
</html>
